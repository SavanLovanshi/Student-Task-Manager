<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Task Manager</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 420px;
      padding: 30px;
      border-radius: 22px;
      background: linear-gradient(160deg, #1f3c4c, #16222a);
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #f6f6f6;
      letter-spacing: 0.5px;
    }

    .input-group {
      display: flex;
      gap: 12px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      outline: none;
      background: #203a43;
      color: #eaeaea;
    }

    input::placeholder {
      color: #9fb3bd;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff6a3d, #ff9068);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255,106,61,0.5);
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 25px;
    }

    li {
      background: linear-gradient(135deg, #203a43, #2c5364);
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #f1f1f1;
      display: flex;
      align-items: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    }

    li::before {
      content: "🔥";
      margin-right: 10px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #b0c4cf;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>🔥 Student Task Manager</h2>

    <div class="input-group">
      <input id="task" type="text" placeholder="Type your task..." />
      <button onclick="addTask()">Add</button>
    </div>

    <ul id="list"></ul>

    <div class="footer">
       •Tasks List 
    </div>
  </div>

  <script>
    function loadTasks() {
      fetch("/tasks")
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById("list");
          list.innerHTML = "";
          data.forEach(t => {
            const li = document.createElement("li");
            li.textContent = t.task;
            list.appendChild(li);
          });
        });
    }

    function addTask() {
      const input = document.getElementById("task");
      if (!input.value.trim()) return;

      fetch("/add-task", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task: input.value })
      }).then(() => {
        input.value = "";
        loadTasks();
      });
    }

    loadTasks();
  </script>

</body>
</html>
